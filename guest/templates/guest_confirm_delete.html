{% extends 'base.html' %}

{% block title %}Delete Guest{% endblock %}

{% block content %}

<style>

.delete-container{
display:flex;
justify-content:center;
align-items:center;
margin-top:60px;
}

.delete-card{
background:white;
padding:40px;
width:420px;
border-radius:15px;
text-align:center;
box-shadow:0 8px 25px rgba(0,0,0,0.1);
}

.delete-icon{
font-size:50px;
margin-bottom:15px;
color:#dc3545;
}

.delete-title{
font-size:24px;
font-weight:600;
margin-bottom:10px;
}

.delete-text{
color:#666;
margin-bottom:30px;
}

.delete-buttons{
display:flex;
justify-content:center;
gap:15px;
}

.btn-delete{
background:#dc3545;
color:white;
padding:10px 18px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:14px;
transition:0.3s;
}

.btn-delete:hover{
background:#bb2d3b;
}

.btn-cancel{
background:#6c757d;
color:white;
padding:10px 18px;
border-radius:8px;
text-decoration:none;
font-size:14px;
transition:0.3s;
}

.btn-cancel:hover{
background:#5a6268;
}

</style>


<div class="delete-container">

<div class="delete-card">

<div class="delete-icon">⚠️</div>

<div class="delete-title">
Delete Guest
</div>

<p class="delete-text">
Are you sure you want to delete this guest?  
This action cannot be undone.
</p>

<form method="post">
{% csrf_token %}

<div class="delete-buttons">

<button type="submit" class="btn-delete">
🗑 Delete
</button>

<a href="{% url 'guest_list' %}" class="btn-cancel">
Cancel
</a>

</div>

</form>

</div>

</div>

{% endblock %}
